spring:
  application:
    name: hotel-service
  cloud:
    loadbalancer:
      cache:
        enabled: false
      retry:
        enabled: false
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

hotel:
  jwt:
    issuer: "${HOTEL_JWT_ISSUER:http://booking-service}"
    public-key: "${HOTEL_JWT_PUBLIC_KEY:file:./secrets/booking-public.pem}"
  booking:
    base-url: http://booking-service
    connect-timeout: 500ms
    read-timeout: 1s

eureka:
  client:
    jersey:
      enabled: false
    restclient:
      enabled: true
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: "${EUREKA_URL:http://127.0.0.1:8761/eureka/}"
  instance:
    hostname: 127.0.0.1

logging:
  pattern:
    level: '%5p service=${spring.application.name} traceId=%X{traceId:-}'

springdoc:
  paths-to-exclude: /api/rooms/*/confirm-availability,/api/rooms/*/release

hotel-booking:
  openapi:
    title: Hotel Service
