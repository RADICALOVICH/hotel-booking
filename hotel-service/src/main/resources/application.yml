spring:
  application:
    name: hotel-service
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

hotel:
  jwt:
    issuer: "${HOTEL_JWT_ISSUER:http://booking-service}"
    public-key: "${HOTEL_JWT_PUBLIC_KEY:file:./secrets/booking-public.pem}"
  booking:
    base-url: "${HOTEL_BOOKING_URL:http://127.0.0.1:8081}"
    connect-timeout: 500ms
    read-timeout: 1s
