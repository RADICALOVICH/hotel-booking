spring:
  application:
    name: booking-service
  cloud:
    loadbalancer:
      eager-load:
        clients:
          - hotel-service
      service-discovery:
        timeout: 500ms
      cache:
        enabled: false
      retry:
        enabled: false
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

booking:
  jwt:
    issuer: "${BOOKING_JWT_ISSUER:http://booking-service}"
    private-key: "${BOOKING_JWT_PRIVATE_KEY:file:./secrets/booking-private.pem}"
    public-key: "${BOOKING_JWT_PUBLIC_KEY:file:./secrets/booking-public.pem}"
  initial-admin:
    username: "${BOOKING_ADMIN_USERNAME:}"
    password: "${BOOKING_ADMIN_PASSWORD:}"

eureka:
  client:
    jersey:
      enabled: false
    restclient:
      enabled: true
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: "${EUREKA_URL:http://127.0.0.1:8761/eureka/}"
  instance:
    hostname: 127.0.0.1

logging:
  pattern:
    level: '%5p service=${spring.application.name} traceId=%X{traceId:-}'

springdoc:
  paths-to-exclude: /internal/**

hotel-booking:
  openapi:
    title: Booking Service
